<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Musical System Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="main-grid">
  <div id="sidebar">
    <h1>Music System Creator</h1>
    <a href="#system-config" id="display-settings">Settings</a>
    <a href="#keys" id="display-keys">Keyboard</a>
    <!-- <button id="menu-icon">&#171;</button> -->
  </div>
  <div id="main">
    <form id="system-config">
      <div class="form-group">
        <label for="calculator">System Calculator:</label>
        <select id="calculator"></select>
      </div>
      <div class="form-group">
        <label for="primaryRootFrequency">Root Note Frequency:</label>
        <input type="number" id="primaryRootFrequency" min="1" max="15000" value="440" required>
      </div>
      <div class="form-group">
        <label for="notes">Number of Notes in Diapason:</label>
        <input type="number" id="notes" min="1" max="26" value="12" required>
      </div>
      <input type="submit" value="Generate System">
    </form>

    <div id="keys">
      <div id="alphaKeyTable"></div>
      <div id="numericKeyTable"></div>
      <div id="arrowKeyTable"></div>
      <div id="escapeKeyTable"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/keys/alphaKeyHandler.js"></script>
  <script type="module" src="js/keys/numericKeyHandler.js"></script>
  <script type="module" src="js/keys/arrowKeyHandler.js"></script>
  <script type="module" src="js/keys/escapeKeyHandler.js"></script>

</body>
</html>
