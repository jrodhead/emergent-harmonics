<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Musical System Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <h1>Musical System Generator</h1>

  <div id="mainGrid">

    <form id="systemConfigForm">

      <div class="formGroup">
        <label for="primaryRootFrequency">Root Note Frequency:</label>
        <input type="number" id="primaryRootFrequency" min="1" max="15000" value="54" required>
      </div>
      <div class="formGroup">
        <label for="notes">Number of Notes in Diapason:</label>
        <input type="number" id="notes" min="1" max="26" value="7" required>
      </div>
      <div class="formGroup">
        <label for="diapasons">Number of Diapasons:</label>
        <input type="number" id="diapasons" min="1" max="20" value="5" required>
      </div>
      <div class="formGroup">
        <label for="calculator">System Calculator:</label>
        <select id="calculator">
          <option value="majorScale" selected>Major Scale - Pythagorean</option>
          <option value="minorScale">Minor Scale - Pythagorean</option>
          <option value="equalTemperament">Equal Temperament</option>
          <option value="HD110067">Planetary System HD 110067</option>
        </select>
      </div>

      <input type="submit" value="Generate System">

    </form>

    <div id="keys">
      <div id="alphaKeyTable"></div>
      <div id="numericKeyTable"></div>
      <div id="arrowKeyTable"></div>
      <div id="escapeKeyTable"></div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/keys/alphaKeyHandler.js"></script>
  <script type="module" src="js/keys/numericKeyHandler.js"></script>
  <script type="module" src="js/keys/arrowKeyHandler.js"></script>
  <script type="module" src="js/keys/escapeKeyHandler.js"></script>

</body>
</html>
