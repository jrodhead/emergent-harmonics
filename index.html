<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Musical System Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <form id="system-config">
      <legend>System Configuration</legend>
      <div class="form-group">
        <label for="calculator">Calculator:</label>
        <select id="calculator"></select>
      </div>
      <div class="form-group">
        <label for="primaryRootFrequency">Root:</label>
        <input type="number" id="primaryRootFrequency" min="20" max="880" value="108" required>Hz
      </div>
      <input type="submit" value="Generate System">
    </form>
  </header>

  <main>
    <div id="keys">
      <div id="alphaKeyTable"></div>
      <div id="numericKeyTable"></div>
      <div id="arrowKeyTable"></div>
      <div id="escapeKeyTable"></div>
    </div>
  </main>

  <footer>
    <form id="oscillator-config">
      <legend>Oscillator Configuration</legend>
      <div class="form-group">
        <label for="waveShape">Oscillator Type:</label>
        <select id="waveShape">
          <option value="sine">Sine</option>
          <option value="square">Square</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="triangle">Triangle</option>
        </select>
      </div>
      <div class="form-group">
        <label for="oscillatorVolume">Oscillator Volume:</label>
        <input type="range" id="oscillatorVolume" min="0" max="1" step="0.01" value="0.5">
        <output for="oscillatorVolume" id="volumeOutput">0.5</output>
      </div>
      <!-- <div class="form-group">
        <label for="attack">Attack:</label>
        <input type="number" id="attack" min="0" max="10" step="0.01" value="0.01">s
      </div>
      <div class="form-group">
        <label for="decay">Decay:</label>
        <input type="number" id="decay" min="0" max="10" step="0.01" value="0.1">s
      </div>
      <div class="form-group">
        <label for="sustain">Sustain:</label>
        <input type="number" id="sustain" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="form-group">
        <label for="release">Release:</label>
        <input type="number" id="release" min="0" max="10" step="0.01" value="1">s
      </div> -->
    </form>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/keys/alphaKeyHandler.js"></script>
  <script type="module" src="js/keys/numericKeyHandler.js"></script>
  <script type="module" src="js/keys/arrowKeyHandler.js"></script>
  <script type="module" src="js/keys/escapeKeyHandler.js"></script>

</body>
</html>
