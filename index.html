<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Musical System Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <nav id="viewToggle">
      <button type="button" data-show-view="config">Configure System</button>
      <button type="button" data-show-view="play">Play</button>
    </nav>
  </header>

  <main>
    <section id="systemConfig">
      <div class="config-toolbar">
        <legend>System Configuration</legend>
        <div class="form-group">
          <label for="configRootFrequency">Root:</label>
          <input type="number" id="configRootFrequency" step="0.01">Hz
        </div>
        <div class="form-group">
          <label for="presetSelect">Preset:</label>
          <select id="presetSelect"></select>
          <button type="button" id="loadPreset">Load into scale</button>
          <span id="presetFamilyHint" class="config-inline-hint"></span>
        </div>
        <div class="form-group">
          <button type="button" id="exportConfig">Export JSON</button>
          <button type="button" id="importConfig">Import JSON</button>
          <input type="file" id="importConfigFile" accept="application/json,.json" hidden>
          <button type="button" id="resetConfig">Reset</button>
        </div>
      </div>

      <div id="configScales"></div>
      <div id="configNotes"></div>
    </section>

    <div id="keys">
      <div id="noteKeyTable"></div>
      <div id="rootKeyTable"></div>
      <div id="arrowKeyTable"></div>
      <div id="escapeKeyTable"></div>
      <div id="playModeTable">Play mode: <span id="playMode">latch</span> (press * to switch)</div>
      <div id="sustainPedalTable">Sustain: <span id="sustainPedal">up</span> (hold Space)</div>
      <div id="droneTable">Drone: <span id="drone">off</span>, <span id="droneMode">anchored</span> (` to toggle, ~ to switch)</div>
      <div id="intervalReadout"></div>
      <div id="consonanceMeter"></div>
    </div>
  </main>

  <footer>
    <form id="oscillator-config">
      <legend>Oscillator Configuration</legend>
      <div class="form-group">
        <label for="waveShape">Oscillator Type:</label>
        <select id="waveShape">
          <option value="sine">Sine</option>
          <option value="square">Square</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="triangle">Triangle</option>
        </select>
      </div>
      <div class="form-group">
        <label for="oscillatorVolume">Oscillator Volume:</label>
        <input type="range" id="oscillatorVolume" min="0" max="1" step="0.01" value="0.5">
        <output for="oscillatorVolume" id="volumeOutput">0.5</output>
      </div>
      <div class="form-group">
        <label for="attackTime">Attack:</label>
        <input type="range" id="attackTime" min="0" max="2000" step="10" value="10">
        <output for="attackTime" id="attackOutput">10 ms</output>
      </div>
      <div class="form-group">
        <label for="releaseTime">Release:</label>
        <input type="range" id="releaseTime" min="0" max="2000" step="10" value="120">
        <output for="releaseTime" id="releaseOutput">120 ms</output>
      </div>
      <div class="form-group">
        <label for="glideTime">Glide:</label>
        <input type="range" id="glideTime" min="0" max="500" step="10" value="80">
        <output for="glideTime" id="glideOutput">80 ms</output>
      </div>
      <div class="form-group">
        <label for="dronePeriod">Drone pitch:</label>
        <input type="range" id="dronePeriod" min="-3" max="1" step="1" value="-1">
        <output for="dronePeriod" id="dronePeriodOutput">1 period below</output>
      </div>
      <div class="form-group">
        <label for="droneVolume">Drone level:</label>
        <input type="range" id="droneVolume" min="0" max="1" step="0.01" value="0.3">
        <output for="droneVolume" id="droneVolumeOutput">0.3</output>
      </div>
    </form>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/keys/noteKeyHandler.js"></script>
  <script type="module" src="js/keys/rootKeyHandler.js"></script>
  <script type="module" src="js/keys/arrowKeyHandler.js"></script>
  <script type="module" src="js/keys/escapeKeyHandler.js"></script>
  <script type="module" src="js/keys/playModeHandler.js"></script>
  <script type="module" src="js/keys/sustainPedalHandler.js"></script>
  <script type="module" src="js/keys/droneHandler.js"></script>
  <script type="module" src="js/keys/intervalReadout.js"></script>
  <script type="module" src="js/keys/consonanceMeter.js"></script>

</body>
</html>
