<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Musical System Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <nav id="viewToggle">
      <button type="button" data-show-view="config">Configure System</button>
      <button type="button" data-show-view="play">Play</button>
    </nav>
  </header>

  <main>
    <section id="systemConfig">
      <div class="config-toolbar">
        <legend>System Configuration</legend>
        <div class="form-group">
          <label for="configRootFrequency">Root:</label>
          <input type="number" id="configRootFrequency" min="20" max="20000" step="0.01" value="27">Hz
        </div>
        <div class="form-group">
          <label for="presetSelect">Calculator:</label>
          <select id="presetSelect"></select>
          <button type="button" id="loadPreset">Load into diapason</button>
        </div>
        <div class="form-group">
          <button type="button" id="exportConfig">Export JSON</button>
          <button type="button" id="importConfig">Import JSON</button>
          <input type="file" id="importConfigFile" accept="application/json,.json" hidden>
          <button type="button" id="resetConfig">Reset</button>
        </div>
      </div>

      <div id="configDiapasons"></div>
      <div id="configNotes"></div>
    </section>

    <div id="keys">
      <div id="noteKeyTable"></div>
      <div id="rootKeyTable"></div>
      <div id="arrowKeyTable"></div>
      <div id="escapeKeyTable"></div>
      <div id="playModeTable">Play mode: <span id="playMode">latch</span> (press * to switch)</div>
    </div>
  </main>

  <footer>
    <form id="oscillator-config">
      <legend>Oscillator Configuration</legend>
      <div class="form-group">
        <label for="waveShape">Oscillator Type:</label>
        <select id="waveShape">
          <option value="sine">Sine</option>
          <option value="square">Square</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="triangle">Triangle</option>
        </select>
      </div>
      <div class="form-group">
        <label for="oscillatorVolume">Oscillator Volume:</label>
        <input type="range" id="oscillatorVolume" min="0" max="1" step="0.01" value="0.5">
        <output for="oscillatorVolume" id="volumeOutput">0.5</output>
      </div>
    </form>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/keys/noteKeyHandler.js"></script>
  <script type="module" src="js/keys/rootKeyHandler.js"></script>
  <script type="module" src="js/keys/arrowKeyHandler.js"></script>
  <script type="module" src="js/keys/escapeKeyHandler.js"></script>
  <script type="module" src="js/keys/playModeHandler.js"></script>

</body>
</html>
