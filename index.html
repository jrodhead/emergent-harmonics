<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Musical System Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <form id="system-config">
      <div class="form-group">
        <label for="calculator">Calculator:</label>
        <select id="calculator"></select>
      </div>
      <div class="form-group">
        <label for="primaryRootFrequency">Root:</label>
        <input type="number" id="primaryRootFrequency" min="20" max="880" value="108" required>Hz
      </div>
      <input type="submit" value="Generate System">
    </form>
  </header>

  <div id="keys">
    <div id="alphaKeyTable"></div>
    <div id="numericKeyTable"></div>
    <div id="arrowKeyTable"></div>
    <div id="escapeKeyTable"></div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/keys/alphaKeyHandler.js"></script>
  <script type="module" src="js/keys/numericKeyHandler.js"></script>
  <script type="module" src="js/keys/arrowKeyHandler.js"></script>
  <script type="module" src="js/keys/escapeKeyHandler.js"></script>

</body>
</html>
